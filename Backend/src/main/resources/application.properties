spring.application.name=Portiva

# ── Database (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:portiva}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:portiva}
spring.datasource.password=${DB_PASSWORD:portiva}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:VztefHmHTMCBn0w3eJaVUuBRAI7umEKOzhbTJOupMhNrH48VUU2zwRTRgINKgZh8Ks2cKS820p5BpyXDcMQx5A}
jwt.expiration-ms=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080