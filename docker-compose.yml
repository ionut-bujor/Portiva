services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portiva
      POSTGRES_USER: portiva
      POSTGRES_PASSWORD: portiva
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portiva"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: portiva
      DB_USERNAME: portiva
      DB_PASSWORD: portiva
      JWT_SECRET: change-me-to-something-secret-in-production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
